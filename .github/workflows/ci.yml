name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: "Frontend: lint, typecheck y empaquetado"
        run: |
          npm ci --no-audit --no-fund
          npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias de prueba
        run: |
          python -m pip install --upgrade pip
          pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: Reglas de texto, catálogo, contrato de datos y prueba de humo de la web
        run: python -m pytest
